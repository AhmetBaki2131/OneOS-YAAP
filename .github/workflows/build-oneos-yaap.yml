name: Build OneOS Custom ROM APKs (SM-A055F)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout OneOS-YAAP
        uses: actions/checkout@v4
        with:
          path: yaap

      - name: Use repository-owned OneOS source snapshot
        run: |
          test -d yaap/OneOS-source/app-android
          test -d yaap/OneOS-source/switcher
          cp -a yaap/OneOS-source OneOS
          echo "Building the source owned by AhmetBaki2131/OneOS-YAAP; no upstream checkout."

      - name: Apply custom-ROM patches for Galaxy A05 (SM-A055F)
        run: |
          pwsh -NoProfile -File yaap/oneos_repo_patches/apply_yaap_patches.ps1 -OneOsRoot "$PWD/OneOS"
          python3 yaap/oneos_repo_patches/apply_multirom_patches.py --root "$PWD/OneOS" --check
          python3 yaap/oneos_repo_patches/apply_multirom_patches.py --root "$PWD/OneOS"
          python3 yaap/oneos_repo_patches/apply_android15_16_17_compat.py --root "$PWD/OneOS" --check
          python3 yaap/oneos_repo_patches/apply_android15_16_17_compat.py --root "$PWD/OneOS"
          cp yaap/oneos_repo_patches/AndroidHostMatrixTest.kt OneOS/app-android/core/model/src/test/kotlin/com/fahadali/oneos/core/model/AndroidHostMatrixTest.kt

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK Platform 37 and Build-Tools 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)"
          fi
          printf 'y\n%.0s' $(seq 1 50) > /tmp/sdk_yes.txt
          "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses < /tmp/sdk_yes.txt >/dev/null || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0" < /tmp/sdk_yes.txt
          echo "sdk.dir=$SDK_ROOT" > OneOS/app-android/local.properties

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Audit A05 IInstalld ABI offline
        run: |
          python3 -m unittest discover -s yaap/scripts -p 'test_audit_installd_abi.py' -v
          python3 yaap/scripts/audit_installd_abi.py \
            --reference OneOS/switcher/patches/host_installd.txt \
            --host yaap/probe_results/host_installd_yaap.txt \
            --guest-sdk 37 --host-sdk 37 --json > "$RUNNER_TEMP/a05-instald-abi.json"
          python3 yaap/scripts/audit_installd_abi.py \
            --reference OneOS/switcher/patches/host_installd.txt \
            --host OneOS/switcher/patches/host_installd_a16.txt \
            --guest-sdk 37 --host-sdk 36 --json > "$RUNNER_TEMP/oneui8-vs-coloros17-reference.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / "a05-instald-abi.json").read_text())
          assert report["direct"] == 25, report
          assert report["code_shifts"] == 2, report
          assert report["missing"] == report["signature_mismatches"] == 0, report
          assert report["launch_verified"] is False
          print("A05 ABI audit OK: 25 direct calls, 2 fsverity shifts")
          PY

      - name: Upload IInstalld ABI reports
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-ABI-Reference-Reports
          path: |
            ${{ runner.temp }}/a05-instald-abi.json
            ${{ runner.temp }}/oneui8-vs-coloros17-reference.json
          if-no-files-found: error

      - name: Test Android 15-17 host compatibility gates
        working-directory: OneOS/app-android
        run: |
          chmod +x gradlew
          ./gradlew :core:model:test --tests "*AndroidHostMatrixTest" --console=plain

      - name: Audit read-only root lists, script safety, and LF line endings
        working-directory: OneOS/app-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad = []
          for base in (
              Path("app/src/main/assets/probe"),
              Path("app/src/full/assets/root"),
              Path("app/src/full/assets/logs"),
              Path("../switcher/assets"),
          ):
              if not base.exists():
                  continue
              for p in base.rglob("*"):
                  if p.suffix in (".sh", ".list") and b"\r" in p.read_bytes():
                      bad.append(str(p))
          assert not bad, f"CRLF found in shell/list assets: {bad}"
          print("LF line ending check OK")
          PY
          ./gradlew :core:root:testDebugUnitTest --tests "*ReadOnlyListsTest" --tests "*StageAuditTest" --tests "*EditionsTest" --console=plain

      - name: Build guest manager APK and stage it
        working-directory: OneOS/app-android
        env:
          GH_PACKAGES_USER: ${{ github.repository_owner }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :guest:assembleDebug --console=plain
          cp guest/build/outputs/apk/debug/guest-debug.apk ../switcher/assets/guest_manager.apk
          ls -lh ../switcher/assets/guest_manager.apk

      - name: Build patched OneOS FullDebug APK (includes checkFullDebugStagingApk)
        working-directory: OneOS/app-android
        env:
          GH_PACKAGES_USER: ${{ github.repository_owner }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          ./gradlew :app:assembleFullDebug --console=plain
          ls -lh app/build/outputs/apk/full/debug/

      - name: Build root-required English OneOS Probe APK (includes checkProbeDebugApk)
        working-directory: OneOS/app-android
        env:
          GH_PACKAGES_USER: ${{ github.repository_owner }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          ./gradlew :app:assembleProbeDebug --console=plain
          ls -lh app/build/outputs/apk/probe/debug/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-CustomROM-A05-APKs
          path: |
            OneOS/app-android/app/build/outputs/apk/full/debug/app-full-debug.apk
            OneOS/app-android/app/build/outputs/apk/probe/debug/app-probe-debug.apk
            OneOS/app-android/guest/build/outputs/apk/debug/guest-debug.apk
          if-no-files-found: error

      - name: Upload OneOS Probe Device Report APK
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-Probe-DeviceReport-APK
          path: |
            OneOS/app-android/app/build/outputs/apk/probe/debug/app-probe-debug.apk
          if-no-files-found: error

      - name: Run root script & installd tests
        working-directory: OneOS/app-android
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_PACKAGES_USER: ${{ github.repository_owner }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          ./gradlew :core:root:test :core:safety:test --console=plain

